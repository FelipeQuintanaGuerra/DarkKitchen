<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class="material-icons">restaurant</i>
      </div>
      <h1>Dark Kitchen</h1>
      <p>Iniciá sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <i class="material-icons">mail</i>
          <input type="email" formControlName="email" placeholder="email@ejemplo.com">
        </div>
        <span class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">El email es requerido</span>
        <span class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">Ingresá un email válido</span>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="material-icons">lock</i>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Tu contraseña">
          <i class="material-icons toggle-password" (click)="showPassword = !showPassword">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
        </div>
        <span class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">La contraseña es requerida</span>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <p class="alt-link">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
  </div>
</div>
