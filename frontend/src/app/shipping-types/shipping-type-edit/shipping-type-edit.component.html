<div class="page-container">
  <div class="page-header">
    <a routerLink="/shipping-types" class="btn-back">
      <i class="material-icons">arrow_back</i>
    </a>
    <h1>Editar tipo de envío</h1>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre</label>
        <div class="input-wrapper">
          <i class="material-icons">local_shipping</i>
          <input type="text" formControlName="name" placeholder="Ej: Express, Standard">
        </div>
        <span class="field-error" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">El nombre es requerido</span>
      </div>

      <div class="form-group">
        <label>Costo</label>
        <div class="input-wrapper">
          <i class="material-icons">attach_money</i>
          <input type="number" formControlName="cost" placeholder="0.00" step="0.01">
        </div>
        <span class="field-error" *ngIf="form.get('cost')?.touched && form.get('cost')?.hasError('required')">El costo es requerido</span>
        <span class="field-error" *ngIf="form.get('cost')?.touched && form.get('cost')?.hasError('min')">El costo debe ser mayor o igual a 0</span>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <a routerLink="/shipping-types" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
