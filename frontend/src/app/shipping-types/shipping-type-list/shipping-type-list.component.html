<div class="page-container">
  <div class="page-header">
    <h1>Tipos de envío</h1>
    <a routerLink="/shipping-types/create" class="btn-primary">
      <i class="material-icons">add</i>
      Nuevo tipo de envío
    </a>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div class="table-container" *ngIf="shippingTypes.length > 0">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Costo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let type of shippingTypes">
          <td>{{ type.name }}</td>
          <td>${{ type.cost }}</td>
          <td class="actions">
            <a [routerLink]="['/shipping-types/edit', type.id]" class="btn-icon" title="Editar">
              <i class="material-icons">edit</i>
            </a>
            <button *ngIf="!type.isDefault" class="btn-icon btn-delete" (click)="deleteShippingType(type.id)" title="Eliminar">
              <i class="material-icons">delete</i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="shippingTypes.length === 0 && !errorMessage" class="empty-state">
    <i class="material-icons">local_shipping</i>
    <p>No hay tipos de envío cargados</p>
  </div>
</div>
