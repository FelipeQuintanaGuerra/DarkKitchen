<div class="page-container">
  <div class="page-header">
    <h1>Crear pedido</h1>
  </div>

  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

  <form (ngSubmit)="createOrder()">

    <div class="section-card">
      <h2 class="section-title">Dirección de entrega</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Calle</label>
          <div class="input-wrapper">
            <i class="material-icons">home</i>
            <input type="text" name="street" [(ngModel)]="request.street" placeholder="Nombre de calle" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Número de puerta</label>
          <div class="input-wrapper">
            <i class="material-icons">tag</i>
            <input type="text" name="doorNumber" [(ngModel)]="request.doorNumber" placeholder="Ej: 1234" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Apartamento <span class="optional">(opcional)</span></label>
          <div class="input-wrapper">
            <i class="material-icons">apartment</i>
            <input type="text" name="apartment" [(ngModel)]="request.apartment" placeholder="Ej: 2B" />
          </div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <h2 class="section-title">Tipo de envío</h2>
      <div class="input-wrapper select-wrapper">
        <i class="material-icons">local_shipping</i>
        <select name="shippingTypeId" [(ngModel)]="request.shippingTypeId">
          <option value="">Seleccionar tipo de envío</option>
          <option *ngFor="let shippingType of shippingTypes" [value]="shippingType.id">
            {{ shippingType.name }} — ${{ shippingType.cost }}
          </option>
        </select>
      </div>
    </div>

    <div class="section-card">
      <h2 class="section-title">Productos</h2>
      <div class="product-picker">
        <div class="input-wrapper select-wrapper flex-1">
          <i class="material-icons">restaurant</i>
          <select name="selectedProductId" [(ngModel)]="selectedProductId">
            <option value="">Seleccionar producto</option>
            <option *ngFor="let product of products" [value]="product.id">
              {{ product.name }} — ${{ product.price }}
            </option>
          </select>
        </div>
        <div class="qty-control picker-qty">
          <button type="button" class="btn-qty" (click)="selectedQuantity = selectedQuantity > 1 ? selectedQuantity - 1 : 1">
            <i class="material-icons">remove</i>
          </button>
          <span class="qty-value">{{ selectedQuantity }}</span>
          <button type="button" class="btn-qty" (click)="selectedQuantity = selectedQuantity + 1">
            <i class="material-icons">add</i>
          </button>
        </div>
        <button type="button" class="btn-secondary" (click)="addLine()">
          <i class="material-icons">add</i>
          Agregar
        </button>
      </div>

      <div class="table-container" *ngIf="request.lines.length > 0">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let line of request.lines">
              <td>{{ getProductName(line.productId) }}</td>
              <td>
                <div class="qty-control">
                  <button type="button" class="btn-qty" (click)="changeQuantity(line.productId, -1)">
                    <i class="material-icons">remove</i>
                  </button>
                  <span class="qty-value">{{ line.quantity }}</span>
                  <button type="button" class="btn-qty" (click)="changeQuantity(line.productId, 1)">
                    <i class="material-icons">add</i>
                  </button>
                </div>
              </td>
              <td class="action-col">
                <button type="button" class="btn-remove" (click)="removeLine(line.productId)" title="Quitar">
                  <i class="material-icons">delete</i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="request.lines.length === 0" class="empty-lines">
        <i class="material-icons">shopping_cart</i>
        <span>Sin productos agregados</span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">
        <i class="material-icons">check</i>
        Crear pedido
      </button>
    </div>

  </form>
</div>
