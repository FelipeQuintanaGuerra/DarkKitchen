<h2 mat-dialog-title>Confirmar</h2>

<mat-dialog-content>
  <p>
    Ya iniciaste sesión. Es necesario cerrar sesión antes de acceder como un usuario diferente.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    Cancelar
  </button>

  <button mat-raised-button color="warn" type="button" (click)="logout()">
    Cerrar sesión
  </button>
</mat-dialog-actions>
