<div class="page-container">
  <div class="page-header">
    <a routerLink="/users" class="btn-back">
      <i class="material-icons">arrow_back</i>
    </a>
    <h1>Editar usuario</h1>
  </div>

  <div class="form-card">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre</label>
          <div class="input-wrapper">
            <input type="text" formControlName="name" placeholder="Nombre">
          </div>
          <span class="field-error" *ngIf="userForm.get('name')?.touched && userForm.get('name')?.hasError('required')">El nombre es requerido</span>
        </div>

        <div class="form-group">
          <label>Apellido</label>
          <div class="input-wrapper">
            <input type="text" formControlName="surname" placeholder="Apellido">
          </div>
          <span class="field-error" *ngIf="userForm.get('surname')?.touched && userForm.get('surname')?.hasError('required')">El apellido es requerido</span>
          <span class="field-error" *ngIf="userForm.get('surname')?.touched && userForm.get('surname')?.hasError('minlength')">Mínimo 3 caracteres</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="material-icons">mail</i>
            <input type="email" formControlName="email" placeholder="email@ejemplo.com">
          </div>
          <span class="field-error" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.hasError('required')">El email es requerido</span>
          <span class="field-error" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.hasError('email')">Email inválido</span>
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <div class="input-wrapper">
            <i class="material-icons">phone</i>
            <input type="text" formControlName="phone" placeholder="099123456">
          </div>
          <span class="field-error" *ngIf="userForm.get('phone')?.touched && userForm.get('phone')?.hasError('required')">El teléfono es requerido</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nueva contraseña</label>
          <div class="input-wrapper">
            <i class="material-icons">lock</i>
            <input type="password" formControlName="password" placeholder="Mínimo 15 caracteres">
          </div>
          <span class="field-error" *ngIf="userForm.get('password')?.touched && userForm.get('password')?.hasError('required')">La contraseña es requerida</span>
          <span class="field-error" *ngIf="userForm.get('password')?.touched && userForm.get('password')?.hasError('minlength')">Mínimo 15 caracteres</span>
        </div>

        <div class="form-group">
          <label>Rol</label>
          <div class="input-wrapper select-wrapper">
            <i class="material-icons">badge</i>
            <select formControlName="role">
              <option value="" disabled>Seleccionar rol</option>
              <option value="2">Admin</option>
              <option value="0">Client</option>
              <option value="1">Dispatcher</option>
            </select>
          </div>
          <span class="field-error" *ngIf="userForm.get('role')?.touched && userForm.get('role')?.hasError('required')">El rol es requerido</span>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <a routerLink="/users" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
