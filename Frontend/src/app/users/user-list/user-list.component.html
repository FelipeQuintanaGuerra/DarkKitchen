<div class="page-container">
  <div class="page-header">
    <h1>Usuarios</h1>
    <a routerLink="/users/create" class="btn-primary">
      <i class="material-icons">add</i>
      Nuevo usuario
    </a>
  </div>

  <div class="search-bar">
    <div class="input-wrapper">
      <i class="material-icons">search</i>
      <input type="text" placeholder="Nombre" [(ngModel)]="searchName" (input)="search()">
    </div>
    <div class="input-wrapper">
      <i class="material-icons">search</i>
      <input type="text" placeholder="Apellido" [(ngModel)]="searchSurname" (input)="search()">
    </div>
    <button class="btn-search" (click)="search()">Buscar</button>
    <button class="btn-search btn-secondary" (click)="clearSearch()">Limpiar</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div class="table-container" *ngIf="users.length > 0">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.surname }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge" [class]="'badge-' + getRoleName(user.role).toLowerCase()">{{ getRoleName(user.role) }}</span></td>
          <td class="actions">
            <a [routerLink]="['/users/edit', user.id]" class="btn-icon" title="Editar">
              <i class="material-icons">edit</i>
            </a>
            <button class="btn-icon btn-delete" (click)="deleteUser(user.id)" title="Eliminar">
              <i class="material-icons">delete</i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="users.length === 0 && !errorMessage" class="empty-state">
    <i class="material-icons">group</i>
    <p>No hay usuarios para mostrar</p>
  </div>
</div>
